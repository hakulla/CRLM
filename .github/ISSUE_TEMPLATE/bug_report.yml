name: Bug report
description: Report a reproducible CRLM problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include API keys, tokens, passwords, personal data, or company source in this issue.**
        For security vulnerabilities, use the private Security Advisory link instead of a public issue.
  - type: input
    id: version
    attributes:
      label: CRLM version
      description: App version and build variant
      placeholder: "1.3.4 (147), Offline"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: Model and Android release; redact serial numbers and personal identifiers
      placeholder: "Pixel 7, Android 14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal steps that reproduce the issue
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personal data before posting
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed API keys, tokens, personal data, and company information.
          required: true
        - label: I reproduced this on the latest release.
          required: true
