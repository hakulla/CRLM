name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Build Lite APK
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload CI APK
        uses: actions/upload-artifact@v4
        with:
          name: crlm-lite-ci
          path: build/MobileAgent.apk
          if-no-files-found: error
          retention-days: 7
